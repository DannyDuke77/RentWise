services:
  db:
    image: postgres:16
    volumes:
      - rentwise_postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: ${SQL_DATABASE}
      POSTGRES_USER: ${SQL_USER}
      POSTGRES_PASSWORD: ${SQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SQL_USER} -d ${SQL_DATABASE}"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend/rentwise
    command: sh -c "python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend/rentwise:/usr/src/rentwise
      - django_static:/usr/src/rentwise/static
    env_file:
      - .env.dev
    ports:
      - "8000:8000"
    expose:
      - "8000"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      db:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend/rentwise
    command: celery -A rentwise worker --loglevel=info
    volumes:
      - ./backend/rentwise:/usr/src/rentwise
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started

  celery_beat:
    build:
      context: ./backend/rentwise
    command: celery -A rentwise beat --loglevel=info
    volumes:
      - ./backend/rentwise:/usr/src/rentwise
    env_file:
      - .env.dev
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - ./frontend:/app
    env_file:
      - ./frontend/.env.local.dev
    expose:
      - "3000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - django_static:/usr/src/rentwise/static:ro
    depends_on:
      - frontend
      - backend

volumes:
  rentwise_postgres_data:
  redis_data:
  django_static: